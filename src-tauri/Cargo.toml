[package]
name = "photo-date-fixer"
version = "1.1.1"
description = "Local media timestamp recovery desktop application"
authors = ["Photo Date Fixer contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "photo_date_fixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
regex = "1"
filetime = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
